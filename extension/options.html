<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cosense Image Uploader 設定</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 14px; border: 1px solid #bbb; border-radius: 4px; }
  .row { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  button { padding: 8px 14px; font-size: 14px; border-radius: 4px; border: 1px solid #888; background: #f6f6f6; cursor: pointer; }
  button.primary { background: #3b6ea5; color: #fff; border-color: #3b6ea5; }
  #status { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
  .ok { color: #2e8b57; } .ng { color: #b23a3a; }
  small { color: #666; }
  img#preview { margin-top: 8px; max-width: 100%; border: 1px solid #ddd; display: none; }
</style>
</head>
<body>
  <h1>Cosense Image Uploader 設定</h1>

  <label>Worker URL
    <input type="text" id="endpoint" placeholder="https://cosense-uploader.xxxx.workers.dev">
  </label>
  <small>末尾のスラッシュ不要。<code>/upload</code> は拡張側で付けます。</small>

  <label>アップロードトークン
    <input type="password" id="token" placeholder="wrangler secret put UPLOAD_TOKEN で登録したもの">
  </label>

  <label style="font-weight:400"><input type="checkbox" id="enabled"> 有効にする（オフにすると Cosense 標準の Gyazo アップロードに戻る）</label>

  <div class="row">
    <button class="primary" id="save">保存</button>
    <button id="test">テストアップロード</button>
  </div>
  <div id="status"></div>
  <img id="preview" alt="">

  <p><small>ヒント: Shift を押しながらドロップすると、その1回だけ従来動作（Gyazo）になります。</small></p>

  <script src="options.js"></script>
</body>
</html>
